name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "prisma/seed-data.ts"
      - "site/**"
      - "scripts/build-site.ts"
      - ".github/workflows/pages.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a running one finish rather than shipping a
# half-published site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the self-contained site
        run: npm run build:site

      # Pages is enabled on the repo with "GitHub Actions" as the source.
      # Deliberately no `enablement: true`: the workflow token cannot create a
      # Pages site ("Resource not accessible by integration"), so asking it to
      # only turns an already-working deploy into a hard failure.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
