<title>RideTrack</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  @font-face { font-family: 'Bungee'; font-style: normal; font-weight: 400; src: url({{FONT_BUNGEE}}) format('woff2'); font-display: swap; }
  @font-face { font-family: 'Manrope'; font-style: normal; font-weight: 400 800; src: url({{FONT_MANROPE}}) format('woff2'); font-display: swap; }
  @font-face { font-family: 'Plex Mono'; font-style: normal; font-weight: 400; src: url({{FONT_MONO_400}}) format('woff2'); font-display: swap; }
  @font-face { font-family: 'Plex Mono'; font-style: normal; font-weight: 500; src: url({{FONT_MONO_500}}) format('woff2'); font-display: swap; }
  @font-face { font-family: 'Plex Mono'; font-style: normal; font-weight: 600; src: url({{FONT_MONO_600}}) format('woff2'); font-display: swap; }

  :root {
    --bg: #14121f; --bg-2: #1c1930; --surface: #211d38; --surface-hi: #29234a;
    --ink: #f3ecdd; --ink-dim: #a79fc2; --ink-faint: #6f6790;
    --accent: #ffb020; --accent-ink: #241a02; --track: #46c2c9;
    --line: rgba(243, 236, 221, 0.14); --line-soft: rgba(243, 236, 221, 0.07);
    --good: #4ade80; --danger: #fb7185;
    --shadow: 0 24px 50px -20px rgba(0,0,0,0.6);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #faf3e4; --bg-2: #f2e8d0; --surface: #ffffff; --surface-hi: #fffaf0;
      --ink: #221a35; --ink-dim: #6b6086; --ink-faint: #948aab;
      --accent: #c97a12; --accent-ink: #fff8ec; --track: #0f8a91;
      --line: rgba(34, 26, 53, 0.14); --line-soft: rgba(34, 26, 53, 0.07);
      --good: #16a34a; --danger: #e11d48;
      --shadow: 0 24px 50px -25px rgba(90,70,30,0.28);
      color-scheme: light;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14121f; --bg-2: #1c1930; --surface: #211d38; --surface-hi: #29234a;
    --ink: #f3ecdd; --ink-dim: #a79fc2; --ink-faint: #6f6790;
    --accent: #ffb020; --accent-ink: #241a02; --track: #46c2c9;
    --line: rgba(243, 236, 221, 0.14); --line-soft: rgba(243, 236, 221, 0.07);
    --good: #4ade80; --danger: #fb7185;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #faf3e4; --bg-2: #f2e8d0; --surface: #ffffff; --surface-hi: #fffaf0;
    --ink: #221a35; --ink-dim: #6b6086; --ink-faint: #948aab;
    --accent: #c97a12; --accent-ink: #fff8ec; --track: #0f8a91;
    --line: rgba(34, 26, 53, 0.14); --line-soft: rgba(34, 26, 53, 0.07);
    --good: #16a34a; --danger: #e11d48;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex; flex-direction: column;
  }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  a { color: inherit; text-decoration: none; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  .wordmark { font-family: 'Bungee', system-ui, sans-serif; }
  .mono { font-family: 'Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  #ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.85; }

  .shell { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100vh; }
  .wrap { max-width: 1080px; margin: 0 auto; width: 100%; padding: 0 clamp(18px, 4vw, 40px); }

  header.topbar {
    border-bottom: 1px solid var(--line-soft);
    padding: 16px 0;
  }
  .topbar-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; }
  .brand .fw { width: 26px; height: 26px; }
  nav.tabs { display: flex; gap: 4px; }
  .tab {
    padding: 7px 13px; border-radius: 100px; font-size: 13.5px; font-weight: 600;
    color: var(--ink-dim); cursor: pointer; border: 1px solid transparent;
  }
  .tab:hover { background: var(--surface); }
  .tab.active { background: var(--surface); color: var(--ink); border-color: var(--line); }
  .account-chip {
    display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 6px;
    border-radius: 100px; border: 1px solid var(--line); background: var(--surface);
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .account-chip .av { font-size: 17px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; justify-content: center;
    padding: 9px 16px; border-radius: 9px; font-weight: 700; font-size: 13.5px;
    border: 1px solid transparent; cursor: pointer; transition: transform .12s ease, opacity .12s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { opacity: 0.92; }
  .btn-ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
  .btn-ghost:hover { background: var(--surface-hi); }
  .btn-sm { padding: 6px 12px; font-size: 12.5px; border-radius: 100px; }

  main { flex: 1; padding: 32px 0 60px; }

  /* ---- hero / landing ---- */
  .hero { padding: clamp(28px, 6vw, 56px) 0 8px; }
  .hero-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 32px; align-items: center; }
  @media (max-width: 760px) { .hero-grid { grid-template-columns: 1fr; } }
  .hero-eyebrow { font-family: 'Plex Mono', monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--track); margin-bottom: 14px; }
  .hero h1 { font-family: 'Bungee', system-ui, sans-serif; font-weight: 400; font-size: clamp(34px, 5.2vw, 58px); line-height: 1.02; }
  .hero h1 .accent-word { color: var(--accent); }
  .hero p.lede { margin: 18px 0 0; color: var(--ink-dim); font-size: 16px; line-height: 1.6; max-width: 46ch; }
  .hero-ctas { display: flex; gap: 10px; margin-top: 26px; flex-wrap: wrap; }
  .lights { display: flex; gap: 9px; margin-top: 30px; }
  .lights span { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px 2px color-mix(in srgb, var(--accent) 55%, transparent); animation: twinkle 2.4s ease-in-out infinite; }
  .lights span:nth-child(3n) { background: var(--track); box-shadow: 0 0 8px 2px color-mix(in srgb, var(--track) 55%, transparent); }
  .lights span:nth-child(1){animation-delay:0s}.lights span:nth-child(2){animation-delay:.15s}.lights span:nth-child(3){animation-delay:.3s}.lights span:nth-child(4){animation-delay:.45s}.lights span:nth-child(5){animation-delay:.6s}.lights span:nth-child(6){animation-delay:.75s}.lights span:nth-child(7){animation-delay:.9s}.lights span:nth-child(8){animation-delay:1.05s}
  @keyframes twinkle { 0%,100%{opacity:.35;transform:scale(.85)} 50%{opacity:1;transform:scale(1.15)} }
  @media (prefers-reduced-motion: reduce) { .lights span { animation: none; opacity: .85; } }

  .wheel-wrap { display: flex; align-items: center; justify-content: center; }
  .wheel { width: min(100%, 320px); height: auto; }
  .wheel .rim { animation: spin 40s linear infinite; transform-origin: 100px 100px; }
  .wheel .cabins { animation: spin 40s linear infinite; transform-origin: 100px 100px; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .wheel .rim, .wheel .cabins { animation: none; } }

  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-top: 40px; max-width: 640px; }
  .stat-cell { background: var(--surface); padding: 16px 18px; }
  .stat-cell .num { font-family: 'Plex Mono', monospace; font-weight: 600; font-size: 23px; color: var(--accent); }
  .stat-cell .label { font-size: 12px; color: var(--ink-dim); margin-top: 3px; }

  .demo-note {
    margin-top: 40px; display: flex; gap: 10px; align-items: flex-start;
    border: 1px dashed var(--line); border-radius: 12px; padding: 14px 16px;
    font-size: 12.8px; color: var(--ink-dim); line-height: 1.55; max-width: 640px;
  }
  .demo-note b { color: var(--ink); }

  /* ---- section shell ---- */
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .section-head h2 { font-size: clamp(20px, 2.6vw, 26px); font-weight: 800; }
  .back-link { font-size: 13px; color: var(--ink-faint); margin-bottom: 6px; display: inline-block; }
  .back-link:hover { color: var(--ink-dim); }

  /* ---- controls ---- */
  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
  .input, select {
    background: var(--surface); border: 1px solid var(--line); border-radius: 9px;
    padding: 9px 12px; font-size: 13.5px; color: var(--ink);
  }
  .input { flex: 1; min-width: 180px; }
  .input::placeholder { color: var(--ink-faint); }

  /* ---- park grid ---- */
  .park-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .park-card {
    display: block; border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    background: var(--surface); cursor: pointer; transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .park-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .park-card .banner { height: 64px; overflow: hidden; }
  .banner svg, .ride-thumb svg { display: block; width: 100%; height: 100%; }
  .park-card .body { padding: 13px 14px 15px; }
  .park-card .name { font-weight: 800; font-size: 15px; }
  .park-card .loc { font-size: 12.5px; color: var(--ink-dim); margin-top: 2px; }
  .park-card .meta { font-size: 11.5px; color: var(--ink-faint); margin-top: 8px; display: flex; justify-content: space-between; align-items: center; font-family: 'Plex Mono', monospace; }
  .chain-badge { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 8px; font-weight: 700; text-align: right; flex-shrink: 0; max-width: 42%; line-height: 1.4; }

  /* ---- park detail ---- */
  .about-box { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 18px 20px; margin: 18px 0; }
  .about-box h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faint); margin-bottom: 8px; }
  .about-box .founded { font-weight: 700; margin-bottom: 6px; font-size: 14px; }
  .about-box p.desc { color: var(--ink-dim); font-size: 13.8px; line-height: 1.6; margin: 0; }

  .checkin-box { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 16px 18px; margin-bottom: 22px; display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .checkin-box .field { flex: 1; min-width: 200px; }
  .checkin-box label { display: block; font-size: 11.5px; color: var(--ink-faint); margin-bottom: 5px; }

  .ride-row { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .ride-thumb { width: 76px; height: 54px; border-radius: 8px; flex-shrink: 0; overflow: hidden; }
  .ride-info { flex: 1; min-width: 140px; }
  .ride-info .rname { font-weight: 700; font-size: 14px; }
  .ride-info .rmeta { font-size: 11.5px; color: var(--ink-faint); margin-top: 2px; }
  .ride-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { padding: 6px 11px; border-radius: 100px; border: 1px solid var(--line); font-size: 11.5px; font-weight: 700; cursor: pointer; background: var(--bg-2); color: var(--ink-dim); }
  .pill.on-ridden { background: var(--good); border-color: var(--good); color: #06210f; }
  .pill.on-want { background: var(--track); border-color: var(--track); color: #06201f; }
  .pill.on-fav { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .checkin-log li, .activity-item { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 13px; font-size: 13px; margin-bottom: 7px; list-style: none; }
  .checkin-log { padding: 0; margin: 0; }
  .ts { font-size: 11px; color: var(--ink-faint); font-family: 'Plex Mono', monospace; margin-top: 3px; }

  .empty-hint { color: var(--ink-faint); font-size: 13.5px; }

  /* ---- profile ---- */
  .profile-head { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
  .profile-head .av { font-size: 46px; width: 68px; height: 68px; display: flex; align-items: center; justify-content: center; background: var(--surface); border: 1px solid var(--line); border-radius: 50%; }
  .avatar-grid { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 4px; }
  .avatar-opt { font-size: 22px; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
  .avatar-opt.selected { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--surface)); }
  .mini-ride-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 10px; }
  .mini-ride { display: flex; gap: 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px; align-items: center; }
  .mini-ride .ride-thumb { width: 56px; height: 40px; }
  .mini-ride .rname { font-size: 12.5px; font-weight: 700; }
  .mini-ride .pname { font-size: 11px; color: var(--ink-faint); }

  /* ---- login card ---- */
  .login-wrap { max-width: 420px; margin: 40px auto 0; text-align: center; }
  .login-card { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 28px 26px; box-shadow: var(--shadow); text-align: left; }
  .login-card h1 { font-size: 22px; font-weight: 800; text-align: center; margin-bottom: 6px; }
  .login-card .sub { color: var(--ink-dim); font-size: 13px; text-align: center; margin-bottom: 20px; }
  .field-label { display: block; font-size: 12px; color: var(--ink-faint); margin-bottom: 6px; font-weight: 600; }
  .name-input { width: 100%; padding: 10px 13px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg-2); color: var(--ink); font-size: 14px; margin-bottom: 16px; }

  footer.appfoot { border-top: 1px solid var(--line-soft); padding: 22px 0; font-size: 12px; color: var(--ink-faint); }
  .foot-inner { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

  @media (max-width: 600px) {
    .topbar-inner { flex-direction: column; align-items: flex-start; }
    nav.tabs { order: 3; width: 100%; }
  }
</style>

<canvas id="ambient"></canvas>

<div class="shell">
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand"><svg class="fw" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 20c2-6 5-9 10-9s8 3 10 9" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/><circle cx="6" cy="15" r="1.4" fill="var(--track)"/><circle cx="12" cy="11" r="1.4" fill="var(--track)"/><circle cx="18" cy="15" r="1.4" fill="var(--track)"/></svg> RideTrack</div>
      <nav class="tabs" id="tabs">
        <a class="tab" data-route="#/" href="#/">Home</a>
        <a class="tab" data-route="#/parks" href="#/parks">Parks</a>
        <a class="tab" data-route="#/profile" href="#/profile">Profile</a>
      </nav>
      <div id="account-slot"></div>
    </div>
  </header>

  <main class="wrap" id="app"></main>

  <footer class="appfoot">
    <div class="wrap foot-inner">
      <span id="foot-counts">RideTrack</span>
      <a href="https://github.com/micklelow-source/ridetrack" target="_blank" rel="noopener" style="text-decoration:underline">Source: micklelow-source/ridetrack</a>
      <span id="foot-account" class="mono"></span>
    </div>
  </footer>
</div>

<script id="parks-data" type="application/json">{{PARKS_JSON}}</script>
<script>
/* ============================== DATA ============================== */
const PARKS = JSON.parse(document.getElementById('parks-data').textContent);
const PARKS_BY_SLUG = Object.fromEntries(PARKS.map(p => [p.slug, p]));

const CHAIN_LABELS = {
  DISNEY: 'Disney', UNIVERSAL: 'Universal', SIX_FLAGS: 'Six Flags', CEDAR_FAIR: 'Cedar Fair',
  SEAWORLD: 'SeaWorld / Busch Gardens', HERSCHEND: 'Herschend', INDEPENDENT: 'Independent', OTHER: 'Other',
};
const CHAIN_COLORS = {
  DISNEY: '#5b8def', UNIVERSAL: '#7c5cff', SIX_FLAGS: '#ff5d5d', CEDAR_FAIR: '#ffb020',
  SEAWORLD: '#2fb5d2', HERSCHEND: '#e8785a', INDEPENDENT: '#4ade80', OTHER: '#a79fc2',
};
const RIDE_TYPE_LABELS = {
  ROLLER_COASTER: 'Roller Coaster', DARK_RIDE: 'Dark Ride', WATER_RIDE: 'Water Ride', FLAT_RIDE: 'Flat Ride',
  KIDDIE: 'Kiddie', TRANSPORT: 'Transport', SHOW: 'Show', OTHER: 'Other',
};
const AVATARS = ['🎢','🎡','🎠','🍿','🎟️','🌭','🦄','🚀','🏖️','🐉'];

/* ============================== STORAGE ============================== */
const LS_ACCOUNT = 'ridetrack.account';
function getAccount() {
  try { return JSON.parse(localStorage.getItem(LS_ACCOUNT)); } catch { return null; }
}
function setAccount(acc) { localStorage.setItem(LS_ACCOUNT, JSON.stringify(acc)); }
function clearAccount() { localStorage.removeItem(LS_ACCOUNT); }

function dataKey(suffix) {
  const acc = getAccount();
  return acc ? `ridetrack.${acc.id}.${suffix}` : null;
}
function getStatuses() {
  const key = dataKey('statuses');
  if (!key) return {};
  try { return JSON.parse(localStorage.getItem(key)) || {}; } catch { return {}; }
}
function setStatuses(obj) {
  const key = dataKey('statuses');
  if (key) localStorage.setItem(key, JSON.stringify(obj));
}
function getCheckins() {
  const key = dataKey('checkins');
  if (!key) return [];
  try { return JSON.parse(localStorage.getItem(key)) || []; } catch { return []; }
}
function setCheckins(arr) {
  const key = dataKey('checkins');
  if (key) localStorage.setItem(key, JSON.stringify(arr));
}

function rideStatus(rideId) { return getStatuses()[rideId] || {}; }
function setRideStatus(rideId, patch) {
  const all = getStatuses();
  all[rideId] = { ...all[rideId], ...patch };
  setStatuses(all);
}
function clearRide(rideId) {
  const all = getStatuses();
  delete all[rideId];
  setStatuses(all);
}
function addCheckin(parkId, note) {
  const arr = getCheckins();
  arr.unshift({ parkId, note: note || '', ts: Date.now() });
  setCheckins(arr);
}

/* ============================== SVG THUMBNAILS (generated, no photos) ============================== */
const PALETTES = [
  ['#ff6b4a','#ffb26b'], ['#0ea5b7','#7fe0d6'], ['#6d28d9','#a78bfa'], ['#e11d48','#fb7185'],
  ['#16a34a','#86efac'], ['#4338ca','#818cf8'], ['#d97706','#fbbf24'],
];
function hashStr(s) { let h = 5381; for (let i=0;i<s.length;i++) h = (h*33) ^ s.charCodeAt(i); return Math.abs(h); }
function paletteFor(seed) { return PALETTES[hashStr(seed) % PALETTES.length]; }

function rideThumbSvg(type, seed) {
  const [from, to] = paletteFor(seed);
  const h = hashStr(seed);
  const gid = 'g' + h;
  const stroke = 'rgba(255,255,255,0.9)';
  let motif = '';
  if (type === 'ROLLER_COASTER') {
    const h1 = 30 + (h % 12), h2 = 42 + ((h>>3) % 14);
    motif = `<path d="M -5 90 L 20 90 L 20 ${100-h1} L 45 55 L 60 78 L 85 ${100-h2} L 105 62 L 130 90 L 165 90" fill="none" stroke="${stroke}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
      <line x1="20" y1="${100-h1}" x2="20" y2="92" stroke="rgba(0,0,0,0.35)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="45" cy="55" r="3" fill="rgba(0,0,0,0.35)"/><circle cx="85" cy="${100-h2}" r="3" fill="rgba(0,0,0,0.35)"/>`;
  } else if (type === 'DARK_RIDE') {
    let rays = '';
    for (let i=0;i<5;i++) rays += `<line x1="80" y1="50" x2="${20+i*30}" y2="-10" stroke="rgba(255,255,255,0.28)" stroke-width="8"/>`;
    motif = rays + `<path d="M 30 95 L 30 40 Q 80 5 130 40 L 130 95 Z" fill="none" stroke="${stroke}" stroke-width="4"/>
      <circle cx="45" cy="70" r="2.4" fill="${stroke}"/><circle cx="115" cy="65" r="2" fill="${stroke}"/><circle cx="80" cy="55" r="2.8" fill="${stroke}"/>`;
  } else if (type === 'WATER_RIDE') {
    motif = `<path d="M -10 55 Q 15 40 40 55 T 90 55 T 140 55 T 180 55 V 105 H -10 Z" fill="rgba(255,255,255,0.32)"/>
      <path d="M -10 72 Q 15 57 40 72 T 90 72 T 140 72 T 180 72 V 105 H -10 Z" fill="rgba(255,255,255,0.55)"/>
      <path d="M 95 55 C 95 35 120 35 120 55 C 120 40 138 40 138 58" fill="none" stroke="${stroke}" stroke-width="3.5" stroke-linecap="round"/>`;
  } else if (type === 'FLAT_RIDE') {
    let spokes = '';
    const n = 8;
    for (let i=0;i<n;i++) {
      const a = (i/n)*Math.PI*2 + (h%100)/100;
      spokes += `<line x1="80" y1="52" x2="${80+Math.cos(a)*34}" y2="${52+Math.sin(a)*34}" stroke="${stroke}" stroke-width="3" stroke-linecap="round"/>`;
    }
    motif = spokes + `<circle cx="80" cy="52" r="9" fill="${stroke}"/><circle cx="80" cy="52" r="9" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="2"/>`;
  } else if (type === 'KIDDIE') {
    let spokes = '';
    for (let i=0;i<8;i++) {
      const a = (i/8)*Math.PI*2;
      spokes += `<line x1="${34+Math.cos(a)*16}" y1="${26+Math.sin(a)*16}" x2="${34+Math.cos(a)*21}" y2="${26+Math.sin(a)*21}" stroke="rgba(255,255,255,0.85)" stroke-width="3" stroke-linecap="round"/>`;
    }
    motif = `<circle cx="34" cy="26" r="14" fill="rgba(255,255,255,0.85)"/>` + spokes +
      `<path d="M 60 95 Q 60 60 100 60 Q 140 60 140 95 Z" fill="rgba(255,255,255,0.9)"/>
       <circle cx="78" cy="95" r="7" fill="rgba(0,0,0,0.35)"/><circle cx="122" cy="95" r="7" fill="rgba(0,0,0,0.35)"/>`;
  } else if (type === 'TRANSPORT') {
    let ties = '';
    for (let i=0;i<9;i++) ties += `<line x1="${-5+i*20}" y1="68" x2="${-11+i*20}" y2="83" stroke="rgba(255,255,255,0.5)" stroke-width="3"/>`;
    motif = `<line x1="-10" y1="70" x2="170" y2="70" stroke="${stroke}" stroke-width="3"/><line x1="-10" y1="80" x2="170" y2="80" stroke="${stroke}" stroke-width="3"/>` + ties +
      `<rect x="40" y="38" width="60" height="30" rx="5" fill="rgba(255,255,255,0.92)"/><rect x="48" y="45" width="14" height="12" rx="2" fill="rgba(0,0,0,0.35)"/><rect x="68" y="45" width="14" height="12" rx="2" fill="rgba(0,0,0,0.35)"/>
       <circle cx="52" cy="70" r="5" fill="rgba(0,0,0,0.35)"/><circle cx="88" cy="70" r="5" fill="rgba(0,0,0,0.35)"/>`;
  } else if (type === 'SHOW') {
    motif = `<path d="M 0 0 H 28 V 100 Q 10 100 0 80 Z" fill="rgba(0,0,0,0.28)"/><path d="M 160 0 H 132 V 100 Q 150 100 160 80 Z" fill="rgba(0,0,0,0.28)"/>
      <path d="M 80 20 L 45 95 H 115 Z" fill="rgba(255,255,255,0.35)"/><path d="M 65 8 L 80 -6 L 95 8 L 80 22 Z" fill="${stroke}"/>`;
  } else {
    let tri = '';
    for (let i=0;i<12;i++) {
      const a = (i/12)*Math.PI*2, r1=14, r2=26;
      const pts = `80,50 ${80+Math.cos(a-0.15)*r2},${50+Math.sin(a-0.15)*r2} ${80+Math.cos(a)*r1*1.6},${50+Math.sin(a)*r1*1.6} ${80+Math.cos(a+0.15)*r2},${50+Math.sin(a+0.15)*r2}`;
      tri += `<polygon points="${pts}" fill="rgba(255,255,255,0.75)"/>`;
    }
    motif = tri + `<circle cx="80" cy="50" r="12" fill="${stroke}"/>`;
  }
  return `<svg viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${from}"/><stop offset="100%" stop-color="${to}"/></linearGradient></defs>
    <rect width="160" height="100" fill="url(#${gid})"/>${motif}</svg>`;
}

/* ============================== ROUTER ============================== */
function currentRoute() { return location.hash || '#/'; }
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', () => {
  const totalRides = PARKS.reduce((s,p) => s+p.rides.length, 0);
  document.getElementById('foot-counts').textContent = `RideTrack — ${PARKS.length} USA amusement parks, ${totalRides} rides`;
  initAmbient();
  render();
});

function navigate(hash) { location.hash = hash; }

/* ============================== RENDER ============================== */
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function timeAgo(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' · ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

function render() {
  const route = currentRoute();
  const app = document.getElementById('app');
  const acc = getAccount();

  document.querySelectorAll('.tab').forEach(t => {
    const r = t.dataset.route;
    t.classList.toggle('active', route === r || (r === '#/parks' && route.startsWith('#/parks')));
  });

  renderAccountSlot(acc);

  if (route.startsWith('#/parks/')) {
    const slug = decodeURIComponent(route.slice('#/parks/'.length));
    app.innerHTML = '';
    app.appendChild(renderParkDetail(slug, acc));
  } else if (route === '#/parks') {
    app.innerHTML = '';
    app.appendChild(renderParksList(acc));
  } else if (route === '#/profile') {
    app.innerHTML = '';
    app.appendChild(acc ? renderProfile(acc) : renderLogin('#/profile'));
  } else if (route === '#/login') {
    app.innerHTML = '';
    app.appendChild(renderLogin('#/'));
  } else {
    app.innerHTML = '';
    app.appendChild(renderHome(acc));
  }
  window.scrollTo({ top: 0 });
}

function renderAccountSlot(acc) {
  const slot = document.getElementById('account-slot');
  const foot = document.getElementById('foot-account');
  slot.innerHTML = '';
  if (acc) {
    foot.textContent = `signed in as ${acc.name}`;
    const chip = el(`<button class="account-chip"><span class="av">${acc.avatar}</span><span>${esc(acc.name)}</span></button>`);
    chip.onclick = () => navigate('#/profile');
    slot.appendChild(chip);
  } else {
    foot.textContent = 'not signed in';
    const btn = el(`<button class="btn btn-primary btn-sm">Sign in</button>`);
    btn.onclick = () => navigate('#/login');
    slot.appendChild(btn);
  }
}

/* ---- ferris wheel svg (fun hero graphic) ---- */
function ferrisWheelSvg() {
  let cabins = '';
  const n = 8;
  for (let i=0;i<n;i++) {
    const a = (i/n)*Math.PI*2;
    const x = 100 + Math.cos(a)*72, y = 100 + Math.sin(a)*72;
    const colors = ['#ff6b4a','#0ea5b7','#a78bfa','#fb7185','#86efac','#818cf8','#fbbf24','#ffb26b'];
    cabins += `<g><line x1="100" y1="100" x2="${x}" y2="${y}" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
      <rect x="${x-7}" y="${y-6}" width="14" height="12" rx="3" fill="${colors[i]}"/></g>`;
  }
  return `<svg class="wheel" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
    <line x1="60" y1="210" x2="100" y2="140" stroke="var(--ink-faint)" stroke-width="3"/>
    <line x1="140" y1="210" x2="100" y2="140" stroke="var(--ink-faint)" stroke-width="3"/>
    <g class="cabins">${cabins}</g>
    <circle class="rim" cx="100" cy="100" r="72" fill="none" stroke="var(--accent)" stroke-width="4"/>
    <circle cx="100" cy="100" r="6" fill="var(--track)"/>
  </svg>`;
}

function renderHome(acc) {
  const totalRides = PARKS.reduce((s,p) => s+p.rides.length, 0);

  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`
    <section class="hero">
      <div class="hero-grid">
        <div>
          <div class="hero-eyebrow">Personal ride tracker · USA amusement parks</div>
          <h1>Every ride.<br>Every park.<br><span class="accent-word">Every time.</span></h1>
          <p class="lede">Track which rides you've ridden and want to ride, organized by park — Disney, Universal, Six Flags, SeaWorld, Busch Gardens, and more. Check in when you're there.</p>
          <div class="hero-ctas">
            ${acc ? `<a class="btn btn-primary" href="#/parks">Browse parks →</a>`

          <div class="stat-row">

            <div class="stat-cell"><div class="num">${totalRides}</div><div class="label">Rides</div></div>

          </div>
          <div class="demo-note"><span>🛈</span><span><b>This is a fully working live demo</b> — sign-in and ride tracking are real and interactive, saved right in your browser (no server, no real Google account, no data leaves this tab). Clear your browser storage and it resets.</span></div>
        </div>
        <div class="wheel-wrap">${ferrisWheelSvg()}</div>
      </div>
    </section>
  `));

  if (acc) {
    const statuses = getStatuses();
    const checkins = getCheckins();
    const riddenCount = Object.values(statuses).filter(s => s.status === 'RIDDEN').length;
    const parksVisited = new Set(checkins.map(c => c.parkId)).size;
    const activity = el(`<section style="margin-top:36px"><div class="section-head"><h2>Your activity</h2></div></section>`);
    const statBox = el(`<div class="stat-row" style="margin-top:0"><div class="stat-cell"><div class="num">${riddenCount}</div><div class="label">Rides ridden</div></div><div class="stat-cell"><div class="num">${parksVisited}</div><div class="label">Parks visited</div></div></div>`);
    activity.querySelector('.section-head').after(statBox);
    if (checkins.length) {
      const list = el(`<div style="margin-top:16px"></div>`);
      checkins.slice(0,5).forEach(c => {
        const park = PARKS.find(p => p.slug === c.parkId);
        list.appendChild(el(`<div class="activity-item">Checked in at <a href="#/parks/${c.parkId}" style="text-decoration:underline">${esc(park ? park.name : c.parkId)}</a>${c.note ? ' — "'+esc(c.note)+'"' : ''}<div class="ts">${timeAgo(c.ts)}</div></div>`));
      });
      statBox.after(list);
    }
    wrap.appendChild(activity);
  }

  wrap.appendChild(el(`
    <section style="margin-top:44px">
      <div class="section-head"><h2>Popular right now</h2><a href="#/parks" style="font-size:13px;color:var(--ink-dim)">See all ${PARKS.length} →</a></div>
      <div class="park-grid" id="featured-grid"></div>
    </section>
  `));
  const featuredSlugs = ['magic-kingdom','universal-studios-florida','six-flags-magic-mountain','busch-gardens-williamsburg','seaworld-orlando','cedar-point'];
  const grid = wrap.querySelector('#featured-grid');
  featuredSlugs.forEach(slug => { const p = PARKS_BY_SLUG[slug]; if (p) grid.appendChild(parkCard(p, acc)); });

}

/* ---- PARK CARD ---- */
function parkCard(p, acc) {
  const color = CHAIN_COLORS[p.chain] || '#a79fc2';
  const seedRide = p.rides[0];
  // parks with nothing listed yet still get a banner, so the grid stays even
  const bannerSvg = rideThumbSvg(seedRide ? seedRide.type : 'OTHER', p.slug);
  const card = el(`
    <a class="park-card" href="#/parks/${p.slug}">
      <div class="banner">${bannerSvg}</div>
      <div class="body">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div class="name">${esc(p.name)}</div>
          <span class="chain-badge" style="background:color-mix(in srgb, ${color} 22%, transparent); color:${color}">${CHAIN_LABELS[p.chain]}</span>
        </div>
        <div class="loc">${esc(p.city)}, ${esc(p.state)}${p.foundedYear ? ' · est. '+p.foundedYear : ''}</div>
        <div class="meta"><span>${p.rides.length === 0 ? 'No rides listed yet' : p.rides.length + (p.rides.length === 1 ? ' ride' : ' rides')}</span><span id="ridden-${p.slug}"></span></div>
      </div>
    </a>
  `);
  if (acc) {
    const statuses = getStatuses();
    const ridden = p.rides.filter(r => statuses[r.slug]?.status === 'RIDDEN').length;
    card.querySelector(`#ridden-${p.slug}`).textContent = ridden ? `${ridden} ridden` : '';
  }
  return card;
}

/* ---- PARKS LIST ---- */
let parksFilter = { q: '', chain: '', sort: 'state' };
const SORTERS = {
  state: (a,b) => a.state.localeCompare(b.state) || a.name.localeCompare(b.name),
  name: (a,b) => a.name.localeCompare(b.name),
  founded: (a,b) => (a.foundedYear||9999) - (b.foundedYear||9999) || a.name.localeCompare(b.name),
};
function renderParksList(acc) {
  const wrap = el(`
    <div>
      <div class="section-head"><h2>Parks</h2></div>
      <div class="controls">
        <input class="input" id="park-search" placeholder="Search by park or city…" value="${esc(parksFilter.q)}" />
        <select id="chain-filter">
          <option value="">All chains</option>
          ${Object.entries(CHAIN_LABELS).map(([k,v]) => `<option value="${k}" ${parksFilter.chain===k?'selected':''}>${v}</option>`).join('')}
        </select>
        <select id="sort-select">
          <option value="state" ${parksFilter.sort==='state'?'selected':''}>Sort: State</option>
          <option value="name" ${parksFilter.sort==='name'?'selected':''}>Sort: Name</option>
          <option value="founded" ${parksFilter.sort==='founded'?'selected':''}>Sort: Founded year</option>
        </select>
      </div>
      <div id="parks-grid"></div>
    </div>
  `);
  const search = wrap.querySelector('#park-search');
  const chainSel = wrap.querySelector('#chain-filter');
  const sortSel = wrap.querySelector('#sort-select');
  const grid = wrap.querySelector('#parks-grid');

  function paint() {
    const q = parksFilter.q.trim().toLowerCase();
    const filtered = PARKS.filter(p => {
      const matchesQ = !q || p.name.toLowerCase().includes(q) || p.city.toLowerCase().includes(q);
      const matchesChain = !parksFilter.chain || p.chain === parksFilter.chain;
      return matchesQ && matchesChain;
    }).sort(SORTERS[parksFilter.sort]);
    grid.innerHTML = '';
    if (!filtered.length) { grid.appendChild(el(`<p class="empty-hint">No parks match your filters.</p>`)); return; }

    if (parksFilter.sort === 'state') {
      const groups = [];
      const byState = {};
      filtered.forEach(p => {
        if (!byState[p.state]) { byState[p.state] = []; groups.push(p.state); }
        byState[p.state].push(p);
      });
      groups.forEach(stateCode => {
        const stateParks = byState[stateCode];
        const section = el(`<div style="margin-bottom:22px"><h3 style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin-bottom:8px">${stateCode} · ${stateParks.length} park${stateParks.length===1?'':'s'}</h3></div>`);
        const g = el(`<div class="park-grid"></div>`);
        stateParks.forEach(p => g.appendChild(parkCard(p, acc)));
        section.appendChild(g);
        grid.appendChild(section);
      });
    } else {
      const g = el(`<div class="park-grid"></div>`);
      filtered.forEach(p => g.appendChild(parkCard(p, acc)));
      grid.appendChild(g);
    }
  }
  search.oninput = () => { parksFilter.q = search.value; paint(); };
  chainSel.onchange = () => { parksFilter.chain = chainSel.value; paint(); };
  sortSel.onchange = () => { parksFilter.sort = sortSel.value; paint(); };
  paint();
  return wrap;
}

/* ---- PARK DETAIL ---- */
function renderParkDetail(slug, acc) {
  const park = PARKS_BY_SLUG[slug];
  if (!park) return el(`<div><p>Park not found.</p><a class="btn btn-ghost" href="#/parks">← All parks</a></div>`);

  const statuses = getStatuses();
  const riddenCount = park.rides.filter(r => statuses[r.slug]?.status === 'RIDDEN').length;

  const wrap = el(`
    <div>
      <a class="back-link" href="#/parks">← All parks</a>
      <h1 style="font-size:26px;font-weight:800">${esc(park.name)}</h1>
      <p style="color:var(--ink-dim);font-size:13.5px;margin-top:4px">${esc(park.city)}, ${esc(park.state)}${park.website ? ` · <a href="${esc(park.website)}" target="_blank" rel="noopener" style="text-decoration:underline">Website</a>` : ''}</p>
      ${acc ? `<p style="font-weight:700;font-size:13.5px;margin-top:6px" id="ridden-count">${riddenCount} / ${park.rides.length} rides ridden</p>` : ''}
      ${(park.description || park.foundedYear) ? `
        <div class="about-box">
          <h3>About &amp; history</h3>
          ${park.foundedYear ? `<div class="founded">Opened in ${park.foundedYear} · ${new Date().getFullYear()-park.foundedYear} years of operation</div>` : ''}
          ${park.description ? `<p class="desc">${esc(park.description)}</p>` : ''}
        </div>` : ''}
      <div id="checkin-slot"></div>
      <div class="section-head" style="margin-top:6px"><h2 style="font-size:18px">Rides</h2><span id="ride-count" class="section-note"></span></div>
      <div class="controls" id="ride-filters"></div>
      <div id="ride-list"></div>
      <div class="section-head" style="margin-top:30px"><h2 style="font-size:18px">Your check-ins here</h2></div>
      <ul class="checkin-log" id="checkin-log"></ul>
    </div>
  `);

  const checkinSlot = wrap.querySelector('#checkin-slot');
  if (acc) {
    const box = el(`
      <div class="checkin-box">
        <div class="field"><label>Check in with a note (optional)</label><input class="input" id="checkin-note" placeholder="e.g. Here with the family!" /></div>
        <button class="btn btn-primary" id="checkin-btn">📍 Check in</button>
      </div>
    `);
    box.querySelector('#checkin-btn').onclick = () => {
      const note = box.querySelector('#checkin-note').value;
      addCheckin(park.slug, note);
      box.querySelector('#checkin-note').value = '';
      paintCheckins();
    };
    checkinSlot.appendChild(box);
  } else {
    checkinSlot.appendChild(el(`<p class="empty-hint" style="margin:16px 0"><a href="#/login" style="text-decoration:underline">Sign in</a> to check in and track your ride status at ${esc(park.name)}.</p>`));
  }

  const rideList = wrap.querySelector('#ride-list');
  const riddenCountEl = wrap.querySelector('#ridden-count');
  const rideCountEl = wrap.querySelector('#ride-count');

  // --- ride filters (type + personal status) ---
  const OTHER_TYPES = ['DARK_RIDE','WATER_RIDE','FLAT_RIDE','TRANSPORT','SHOW','OTHER'];
  const TYPE_FILTERS = [
    { value:'all', label:'All ride types', types:[] },
    { value:'ROLLER_COASTER', label:'Roller coasters', types:['ROLLER_COASTER'] },
    { value:'KIDDIE', label:'Kiddie rides', types:['KIDDIE'] },
    { value:'DARK_RIDE', label:'Dark rides', types:['DARK_RIDE'] },
    { value:'WATER_RIDE', label:'Water rides', types:['WATER_RIDE'] },
    { value:'FLAT_RIDE', label:'Flat rides', types:['FLAT_RIDE'] },
    { value:'TRANSPORT', label:'Transport', types:['TRANSPORT'] },
    { value:'SHOW', label:'Shows', types:['SHOW'] },
    { value:'other', label:'Other rides (non-coaster)', types:OTHER_TYPES },
  ];
  const STATUS_FILTERS = [
    { value:'all', label:'All rides' },
    { value:'RIDDEN', label:'✅ Ridden' },
    { value:'WANT_TO_RIDE', label:'🎯 Want to ride' },
    { value:'FAVORITE', label:'⭐ Favorites' },
    { value:'UNTRACKED', label:'Not tracked yet' },
  ];
  let rideFilter = { type:'all', status:'all' };

  const filterBox = wrap.querySelector('#ride-filters');
  const counts = {};
  park.rides.forEach(r => { counts[r.type] = (counts[r.type]||0)+1; });
  const typeSel = el(`<select>${TYPE_FILTERS.map(t=>{
    const n = t.value==='all' ? park.rides.length : t.types.reduce((s,ty)=>s+(counts[ty]||0),0);
    return `<option value="${t.value}"${n===0?' disabled':''}>${t.label} (${n})</option>`;
  }).join('')}</select>`);
  filterBox.appendChild(typeSel);
  typeSel.onchange = () => { rideFilter.type = typeSel.value; paintRides(); };
  if (acc) {
    const statusSel = el(`<select>${STATUS_FILTERS.map(s=>`<option value="${s.value}">${s.label}</option>`).join('')}</select>`);
    filterBox.appendChild(statusSel);
    statusSel.onchange = () => { rideFilter.status = statusSel.value; paintRides(); };
  }

  function paintRides() {
    rideList.innerHTML = '';
    const statuses = getStatuses();
    if (riddenCountEl) {
      const n = park.rides.filter(r => statuses[r.slug]?.status === 'RIDDEN').length;
      riddenCountEl.textContent = `${n} / ${park.rides.length} rides ridden`;
    }
    const activeTypes = (TYPE_FILTERS.find(t=>t.value===rideFilter.type)||{}).types || [];
    const visible = park.rides.filter(r => {
      if (activeTypes.length && !activeTypes.includes(r.type)) return false;
      if (!acc || rideFilter.status === 'all') return true;
      const st = statuses[r.slug];
      if (rideFilter.status === 'FAVORITE') return !!(st && st.favorite);
      if (rideFilter.status === 'UNTRACKED') return !st || (!st.status && !st.favorite);
      return st && st.status === rideFilter.status;
    });
    if (rideCountEl) rideCountEl.textContent = `Showing ${visible.length} of ${park.rides.length}`;
    if (!visible.length) {
      rideList.appendChild(el(`<p class="empty-hint">No rides match these filters.</p>`));
      return;
    }
    visible.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(ride => {
      const st = statuses[ride.slug] || {};
      const row = el(`
        <div class="ride-row">
          <div class="ride-thumb">${rideThumbSvg(ride.type, ride.slug)}</div>
          <div class="ride-info">
            <div class="rname">${esc(ride.name)}${st.favorite ? ' ⭐' : ''}</div>
            <div class="rmeta">${RIDE_TYPE_LABELS[ride.type]}${ride.manufacturer ? ' · '+esc(ride.manufacturer) : ''}${ride.opened ? ' · opened '+ride.opened : ''}</div>
          </div>
          ${acc ? `<div class="ride-actions">
            <button class="pill ridden-btn ${st.status==='RIDDEN'?'on-ridden':''}">✅ Ridden</button>
            <button class="pill want-btn ${st.status==='WANT_TO_RIDE'?'on-want':''}">🎯 Want to ride</button>
            <button class="pill fav-btn ${st.favorite?'on-fav':''}">⭐ Favorite</button>
            ${(st.status||st.favorite) ? `<button class="pill clear-btn">Clear</button>` : ''}
          </div>` : ''}
        </div>
      `);
      if (acc) {
        row.querySelector('.ridden-btn').onclick = () => { setRideStatus(ride.slug, { status: st.status==='RIDDEN'?null:'RIDDEN' }); paintRides(); };
        row.querySelector('.want-btn').onclick = () => { setRideStatus(ride.slug, { status: st.status==='WANT_TO_RIDE'?null:'WANT_TO_RIDE' }); paintRides(); };
        row.querySelector('.fav-btn').onclick = () => { setRideStatus(ride.slug, { favorite: !st.favorite }); paintRides(); };
        const clearBtn = row.querySelector('.clear-btn');
        if (clearBtn) clearBtn.onclick = () => { clearRide(ride.slug); paintRides(); };
      }
      rideList.appendChild(row);
    });
  }
  paintRides();

  const logEl = wrap.querySelector('#checkin-log');
  function paintCheckins() {
    logEl.innerHTML = '';
    const mine = getCheckins().filter(c => c.parkId === park.slug);
    if (!mine.length) { logEl.appendChild(el(`<p class="empty-hint">No check-ins here yet.</p>`)); return; }
    mine.forEach(c => {
      logEl.appendChild(el(`<li>${c.note ? esc(c.note) : '<span style="color:var(--ink-faint)">No note</span>'}<div class="ts">${timeAgo(c.ts)}</div></li>`));
    });
  }
  paintCheckins();

  return wrap;
}

/* ---- LOGIN ---- */
function renderLogin(redirectTo) {
  let chosenAvatar = AVATARS[0];
  const wrap = el(`
    <div class="login-wrap">
      <div class="login-card">
        <h1>Sign in to RideTrack</h1>
        <p class="sub">Pick a name and an avatar to start tracking rides. This creates a demo account saved in this browser.</p>
        <label class="field-label">Your name</label>
        <input class="name-input" id="login-name" placeholder="e.g. Jordan" maxlength="30" />
        <label class="field-label">Avatar</label>
        <div class="avatar-grid" id="avatar-grid"></div>
        <button class="btn btn-primary" id="login-btn" style="width:100%;justify-content:center;margin-top:6px">Continue</button>
        <p style="font-size:11.5px;color:var(--ink-faint);margin-top:14px;line-height:1.5">Not connected to Google or any real account — this is a self-contained interactive demo. The full Next.js app at <a href="https://github.com/micklelow-source/ridetrack" target="_blank" rel="noopener" style="text-decoration:underline">micklelow-source/ridetrack</a> supports real Google sign-in and shared friend status once deployed with a database.</p>
      </div>
    </div>
  `);
  const grid = wrap.querySelector('#avatar-grid');
  AVATARS.forEach((a,i) => {
    const opt = el(`<button class="avatar-opt ${i===0?'selected':''}">${a}</button>`);
    opt.onclick = () => { chosenAvatar = a; grid.querySelectorAll('.avatar-opt').forEach(o=>o.classList.remove('selected')); opt.classList.add('selected'); };
    grid.appendChild(opt);
  });
  wrap.querySelector('#login-btn').onclick = () => {
    const nameInput = wrap.querySelector('#login-name');
    const name = nameInput.value.trim() || 'Guest';
    setAccount({ id: 'u_' + hashStr(name + Date.now()), name, avatar: chosenAvatar });
    navigate(redirectTo || '#/');
  };
  return wrap;
}

/* ---- PROFILE ---- */
function renderProfile(acc) {
  const statuses = getStatuses();
  const checkins = getCheckins();
  const ridden = Object.entries(statuses).filter(([,s]) => s.status === 'RIDDEN');
  const wantToRide = Object.entries(statuses).filter(([,s]) => s.status === 'WANT_TO_RIDE');
  const favorites = Object.entries(statuses).filter(([,s]) => s.favorite);
  const parksVisited = new Set(checkins.map(c => c.parkId)).size;

  function findRide(rideSlug) {
    for (const p of PARKS) { const r = p.rides.find(r => r.slug === rideSlug); if (r) return { ride: r, park: p }; }
    return null;
  }
  function miniGrid(entries) {
    const g = el(`<div class="mini-ride-grid"></div>`);
    entries.forEach(([rideSlug]) => {
      const found = findRide(rideSlug);
      if (!found) return;
      g.appendChild(el(`<a class="mini-ride" href="#/parks/${found.park.slug}"><div class="ride-thumb">${rideThumbSvg(found.ride.type, found.ride.slug)}</div><div><div class="rname">${esc(found.ride.name)}</div><div class="pname">${esc(found.park.name)}</div></div></a>`));
    });
    if (!entries.length) g.appendChild(el(`<p class="empty-hint">Nothing here yet — <a href="#/parks" style="text-decoration:underline">browse parks</a>.</p>`));
    return g;
  }

  const wrap = el(`
    <div>
      <div class="profile-head">
        <div class="av">${acc.avatar}</div>
        <div>
          <h1 style="font-size:22px;font-weight:800">${esc(acc.name)}</h1>
          <p style="color:var(--ink-dim);font-size:12.5px">Demo account · saved in this browser</p>
        </div>
      </div>
      <div class="stat-row" style="grid-template-columns:repeat(3,1fr)">
        <div class="stat-cell"><div class="num">${ridden.length}</div><div class="label">Rides ridden</div></div>
        <div class="stat-cell"><div class="num">${parksVisited}</div><div class="label">Parks visited</div></div>
        <div class="stat-cell"><div class="num">${favorites.length}</div><div class="label">Favorites</div></div>
      </div>

      <div class="section-head" style="margin-top:32px"><h2 style="font-size:17px">Favorite rides</h2></div>
      <div id="fav-slot"></div>

      <div class="section-head" style="margin-top:26px"><h2 style="font-size:17px">Want to ride</h2></div>
      <div id="want-slot"></div>

      <div class="section-head" style="margin-top:26px"><h2 style="font-size:17px">Check-in history</h2></div>
      <ul class="checkin-log" id="ci-slot"></ul>

      <div style="margin-top:36px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" id="signout-btn">Sign out</button>
        <button class="btn btn-ghost btn-sm" id="reset-btn" style="color:var(--danger)">Clear my data</button>
      </div>
    </div>
  `);
  wrap.querySelector('#fav-slot').appendChild(miniGrid(favorites));
  wrap.querySelector('#want-slot').appendChild(miniGrid(wantToRide));
  const ciSlot = wrap.querySelector('#ci-slot');
  if (!checkins.length) ciSlot.appendChild(el(`<p class="empty-hint">No check-ins yet.</p>`));
  checkins.slice(0,20).forEach(c => {
    const park = PARKS_BY_SLUG[c.parkId];
    ciSlot.appendChild(el(`<li><a href="#/parks/${c.parkId}" style="text-decoration:underline;font-weight:700">${esc(park ? park.name : c.parkId)}</a>${c.note ? ' — "'+esc(c.note)+'"' : ''}<div class="ts">${timeAgo(c.ts)}</div></li>`));
  });
  wrap.querySelector('#signout-btn').onclick = () => { clearAccount(); navigate('#/'); };
  wrap.querySelector('#reset-btn').onclick = () => {
    if (confirm('Clear all your ride status and check-ins on this device? This cannot be undone.')) {
      localStorage.removeItem(dataKey('statuses'));
      localStorage.removeItem(dataKey('checkins'));
      render();
    }
  };
  return wrap;
}

/* ---- ambient bg ---- */
function initAmbient() {
  const canvas = document.getElementById('ambient');
  const ctx = canvas.getContext('2d');
  let w, h;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  window.addEventListener('resize', resize);
  function isDark() {
    const t = document.documentElement.getAttribute('data-theme');
    if (t==='dark') return true; if (t==='light') return false;
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  const orbs = [
    { x:.12, y:.08, r:320, dark:'255,176,32', light:'201,122,18', s:.00011, ph:0 },
    { x:.88, y:.04, r:280, dark:'70,194,201', light:'15,138,145', s:.00014, ph:2 },
  ];
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(t) {
    ctx.clearRect(0,0,w,h);
    const dark = isDark();
    orbs.forEach(o => {
      const wob = reduce?0:Math.sin(t*o.s+o.ph)*36;
      const cx = w*o.x+wob, cy = h*o.y+(reduce?0:Math.cos(t*o.s+o.ph)*26);
      const g = ctx.createRadialGradient(cx,cy,0,cx,cy,o.r);
      const rgb = dark?o.dark:o.light, maxA = dark?0.14:0.09;
      g.addColorStop(0,`rgba(${rgb},${maxA})`); g.addColorStop(1,`rgba(${rgb},0)`);
      ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
    });
    if (!reduce) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (reduce) frame(0);
}
</script>
